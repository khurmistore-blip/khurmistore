<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KhurmiStore — Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --orange:#FF6B35;
    --primary:#FF6B35;
    --amber:#F88E20;
    --navy:#0A0E27;
    --navy2:#121736;
    --navy3:#1A2050;
    --text:#E8EAF2;
    --muted:#8B92B5;
    --green:#3DDC84;
    --yellow:#F8C920;
    --blue:#4D9FFF;
    --red:#FF5C5C;
    --border:rgba(255,255,255,0.08);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--navy);
    color:var(--text);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    min-height:100vh;
  }
  /* ---------- LOGIN ---------- */
  #loginScreen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 30% 20%, rgba(255,107,53,0.12), transparent 50%),
               radial-gradient(circle at 80% 80%, rgba(248,142,32,0.10), transparent 50%),
               var(--navy);
    padding:20px;
  }
  .loginBox{
    background:var(--navy2);border:1px solid var(--border);
    border-radius:16px;padding:40px 32px;width:100%;max-width:380px;
    box-shadow:0 20px 60px rgba(0,0,0,0.4);
  }
  /* ---------- ANIMATED LOGO (same as website) ---------- */
  .logo{
    display:flex;align-items:center;gap:10px;justify-content:center;
  }
  .logo-icon{
    position:relative;width:40px;height:40px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .logo-icon > i{
    font-size:20px;color:var(--primary);
    animation:logoFloat 3s ease-in-out infinite, logoGlow 2s ease-in-out infinite alternate, logo3D 6s linear infinite;
    z-index:2;
  }
  .animated-logo:hover .logo-icon > i{ animation:logoSpin 0.8s ease; }

  .wave-ring{
    position:absolute;top:50%;left:50%;width:40px;height:40px;
    border:2px solid var(--primary);border-radius:50%;
    transform:translate(-50%,-50%);animation:waveExpand 2s ease-out infinite;opacity:0;
  }
  .wave-ring:nth-child(2){ animation-delay:0.6s; border-color:#f7931e; }
  .wave-ring:nth-child(3){ animation-delay:1.2s; border-color:#ffd700; }
  .animated-logo:hover .wave-ring{ animation-duration:1s; }

  .particle{
    position:absolute;width:4px;height:4px;background:var(--primary);
    border-radius:50%;box-shadow:0 0 10px var(--primary);
  }
  .p1{ top:0;left:50%;animation:particleFloat1 3s ease-in-out infinite; }
  .p2{ bottom:0;left:20%;background:#f7931e;box-shadow:0 0 10px #f7931e;animation:particleFloat2 3s ease-in-out infinite 0.5s; }
  .p3{ top:20%;right:0;background:#ffd700;box-shadow:0 0 10px #ffd700;animation:particleFloat3 3s ease-in-out infinite 1.0s; }
  .p4{ bottom:20%;right:10%;background:#ff6b35;box-shadow:0 0 10px #ff6b35;animation:particleFloat4 3s ease-in-out infinite 1.5s; }

  .logo-text{
    font-size:24px;font-weight:800;display:flex;align-items:center;gap:1px;
    margin:0;position:relative;
  }
  .logo-text::before{
    content:'';position:absolute;top:0;left:0;width:50%;height:100%;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    transform:translateX(-200%);will-change:transform;
    animation:shine 4s ease-in-out infinite;pointer-events:none;
  }
  .logo-text .letter{
    display:inline-block;color:var(--primary);background:none;
    -webkit-text-fill-color:var(--primary);
    animation:letterDrop 0.6s ease-out both, letterFloat 3s ease-in-out infinite;opacity:0;
  }
  .logo-text .letter:nth-child(1) { animation-delay:0.1s,0.7s; }
  .logo-text .letter:nth-child(2) { animation-delay:0.2s,0.8s; }
  .logo-text .letter:nth-child(3) { animation-delay:0.3s,0.9s; }
  .logo-text .letter:nth-child(4) { animation-delay:0.4s,1.0s; }
  .logo-text .letter:nth-child(5) { animation-delay:0.5s,1.1s; }
  .logo-text .letter:nth-child(6) { animation-delay:0.6s,1.2s; }
  .logo-text .letter:nth-child(7) { animation-delay:0.7s,1.3s; }
  .logo-text .letter:nth-child(8) { animation-delay:0.8s,1.4s; }
  .logo-text .letter:nth-child(9) { animation-delay:0.9s,1.5s; }
  .logo-text .letter:nth-child(10){ animation-delay:1.0s,1.6s; }
  .logo-text .letter:nth-child(11){ animation-delay:1.1s,1.7s; }
  .animated-logo:hover .logo-text .letter{ animation:letterBounce 0.5s ease; }
  .animated-logo:hover .logo-text .letter:nth-child(1) { animation-delay:0.00s; }
  .animated-logo:hover .logo-text .letter:nth-child(2) { animation-delay:0.05s; }
  .animated-logo:hover .logo-text .letter:nth-child(3) { animation-delay:0.10s; }
  .animated-logo:hover .logo-text .letter:nth-child(4) { animation-delay:0.15s; }
  .animated-logo:hover .logo-text .letter:nth-child(5) { animation-delay:0.20s; }
  .animated-logo:hover .logo-text .letter:nth-child(6) { animation-delay:0.25s; }
  .animated-logo:hover .logo-text .letter:nth-child(7) { animation-delay:0.30s; }
  .animated-logo:hover .logo-text .letter:nth-child(8) { animation-delay:0.35s; }
  .animated-logo:hover .logo-text .letter:nth-child(9) { animation-delay:0.40s; }
  .animated-logo:hover .logo-text .letter:nth-child(10){ animation-delay:0.45s; }
  .animated-logo:hover .logo-text .letter:nth-child(11){ animation-delay:0.50s; }

  @keyframes letterDrop{
    0%{opacity:0;transform:translateY(-30px) rotate(180deg) scale(0);}
    60%{transform:translateY(10px) rotate(0deg) scale(1.2);}
    100%{opacity:1;transform:translateY(0) rotate(0deg) scale(1);}
  }
  @keyframes letterFloat{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-3px);} }
  @keyframes letterBounce{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-10px) scale(1.2);} }
  @keyframes shine{ 0%{transform:translateX(-200%);} 50%,100%{transform:translateX(300%);} }
  @keyframes waveExpand{ 0%{width:20px;height:20px;opacity:1;} 100%{width:70px;height:70px;opacity:0;} }
  @keyframes particleFloat1{ 0%,100%{transform:translate(0,0) scale(1);opacity:1;} 50%{transform:translate(-15px,-15px) scale(0.5);opacity:0;} }
  @keyframes particleFloat2{ 0%,100%{transform:translate(0,0) scale(1);opacity:1;} 50%{transform:translate(-20px,15px) scale(0.5);opacity:0;} }
  @keyframes particleFloat3{ 0%,100%{transform:translate(0,0) scale(1);opacity:1;} 50%{transform:translate(20px,-10px) scale(0.5);opacity:0;} }
  @keyframes particleFloat4{ 0%,100%{transform:translate(0,0) scale(1);opacity:1;} 50%{transform:translate(15px,20px) scale(0.5);opacity:0;} }
  @keyframes logoFloat{ 0%,100%{transform:translateY(0) rotate(0deg);} 50%{transform:translateY(-5px) rotate(5deg);} }
  @keyframes logoGlow{
    0%{filter:drop-shadow(0 0 5px rgba(255,107,53,0.5));}
    100%{filter:drop-shadow(0 0 20px rgba(255,107,53,1)) drop-shadow(0 0 30px rgba(247,147,30,0.8));}
  }
  @keyframes logoSpin{ 0%{transform:rotate(0deg) scale(1);} 50%{transform:rotate(180deg) scale(1.3);} 100%{transform:rotate(360deg) scale(1);} }
  @keyframes logo3D{ 0%{transform:rotateY(0deg);} 100%{transform:rotateY(360deg);} }
  .loginSub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:28px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;}
  .field input{
    width:100%;padding:12px 14px;background:var(--navy3);border:1px solid var(--border);
    border-radius:10px;color:var(--text);font-size:14px;outline:none;
    transition:border-color .2s;
  }
  .field input:focus{border-color:var(--orange);}
  .btnPrimary{
    width:100%;padding:13px;border:none;border-radius:10px;cursor:pointer;
    background:linear-gradient(135deg,var(--orange),var(--amber));
    color:#fff;font-weight:700;font-size:14px;margin-top:8px;
    transition:opacity .2s;
  }
  .btnPrimary:hover{opacity:0.9;}
  .btnPrimary:disabled{opacity:0.5;cursor:not-allowed;}
  .loginError{color:var(--red);font-size:13px;text-align:center;margin-top:14px;min-height:16px;}

  /* ---------- DASHBOARD ---------- */
  #dashboard{display:none;}
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 24px;border-bottom:1px solid var(--border);
    background:var(--navy2);position:sticky;top:0;z-index:10;
  }
  header .logo{margin:0;}
  .headerLogo .logo-icon{width:30px;height:30px;}
  .headerLogo .logo-icon > i{font-size:15px;}
  .headerLogo .wave-ring{width:30px;height:30px;}
  .headerLogo .logo-text{font-size:18px;}
  .adminTag{
    font-size:11px;font-weight:700;color:var(--muted);
    border:1px solid var(--border);border-radius:6px;padding:2px 7px;margin-left:4px;
    letter-spacing:0.5px;text-transform:uppercase;
  }
  .headerRight{display:flex;align-items:center;gap:14px;}
  .headerRight span{color:var(--muted);font-size:13px;}
  .lastUpdated{font-size:11px !important;opacity:0.7;}
  #refreshBtn.spinning{opacity:0.5;pointer-events:none;}
  .btnGhost{
    padding:8px 16px;border:1px solid var(--border);border-radius:8px;
    background:transparent;color:var(--text);cursor:pointer;font-size:13px;
  }
  .btnGhost:hover{border-color:var(--orange);}
  main{padding:24px;max-width:1300px;margin:0 auto;}

  .statsGrid{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
    gap:14px;margin-bottom:24px;
  }
  .statCard{
    background:var(--navy2);border:1px solid var(--border);border-radius:14px;
    padding:18px;
  }
  .statCard .label{color:var(--muted);font-size:12px;margin-bottom:8px;}
  .statCard .value{font-size:24px;font-weight:800;}
  .statCard .value.orange{color:var(--orange);}
  .statCard .value.green{color:var(--green);}
  .statCard .value.yellow{color:var(--yellow);}

  .toolbar{
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px;
  }
  .toolbar input, .toolbar select{
    padding:10px 12px;background:var(--navy2);border:1px solid var(--border);
    border-radius:8px;color:var(--text);font-size:13px;outline:none;
  }
  .toolbar input{flex:1;min-width:180px;}
  .spacer{flex:1;}
  .btnAdd{
    padding:10px 18px;border:none;border-radius:8px;cursor:pointer;
    background:linear-gradient(135deg,var(--orange),var(--amber));
    color:#fff;font-weight:700;font-size:13px;white-space:nowrap;
  }
  /* date export bar */
  .dateBar{
    background:var(--navy2);border:1px solid var(--border);
    border-radius:12px;padding:12px 14px;margin-bottom:20px;
  }
  .dateBar input[type="date"]{flex:0 0 auto;min-width:auto;color-scheme:dark;}
  .dateLabel{color:var(--muted);font-size:13px;white-space:nowrap;}
  .rangeSummary{color:var(--muted);font-size:12px;white-space:nowrap;}
  .btnClearDate{
    padding:9px 14px;border:1px solid var(--border);border-radius:8px;cursor:pointer;
    background:transparent;color:var(--muted);font-size:12px;white-space:nowrap;
  }
  .btnClearDate:hover{border-color:var(--orange);color:var(--text);}
  .btnExport{
    padding:10px 18px;border:none;border-radius:8px;cursor:pointer;
    background:linear-gradient(135deg,var(--orange),var(--amber));
    color:#fff;font-weight:800;font-size:13px;white-space:nowrap;
  }
  .btnExport:hover{opacity:0.9;}

  .tableWrap{
    background:var(--navy2);border:1px solid var(--border);border-radius:14px;
    overflow-x:auto;
  }
  table{width:100%;border-collapse:collapse;min-width:800px;}
  thead th{
    text-align:left;padding:14px 16px;font-size:11px;text-transform:uppercase;
    letter-spacing:0.5px;color:var(--muted);border-bottom:1px solid var(--border);
  }
  tbody td{
    padding:14px 16px;font-size:13px;border-bottom:1px solid var(--border);
    vertical-align:top;
  }
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:rgba(255,255,255,0.02);}
  .productsCell{max-width:220px;color:var(--muted);font-size:12px;}
  .totalCell{font-weight:700;color:var(--orange);}
  .sourceTag{
    font-size:11px;padding:3px 8px;border-radius:6px;background:var(--navy3);color:var(--muted);
  }
  select.statusSelect{
    padding:6px 10px;border-radius:8px;font-size:12px;font-weight:600;border:none;cursor:pointer;
  }
  .st-pending{background:rgba(248,201,32,0.15);color:var(--yellow);}
  .st-processing{background:rgba(77,159,255,0.15);color:var(--blue);}
  .st-shipped{background:rgba(255,107,53,0.15);color:var(--orange);}
  .st-delivered{background:rgba(61,220,132,0.15);color:var(--green);}
  .st-cancelled{background:rgba(255,92,92,0.15);color:var(--red);}
  .delBtn{
    background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;
  }
  .delBtn:hover{color:var(--red);}
  .iconBtn{
    background:none;border:none;cursor:pointer;font-size:15px;padding:2px 4px;opacity:0.8;
  }
  .iconBtn:hover{opacity:1;}
  .orderLink{
    color:var(--orange);cursor:pointer;font-weight:600;text-decoration:none;
  }
  .orderLink:hover{text-decoration:underline;}
  .emptyState{padding:50px 20px;text-align:center;color:var(--muted);}

  /* detail modal extras */
  .detailHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  .detailHead h3{margin:0;}
  .statusBadge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:8px;text-transform:capitalize;}
  .detailRow{display:flex;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;gap:10px;}
  .detailRow:last-child{border-bottom:none;}
  .detailRow .dKey{color:var(--muted);min-width:110px;flex-shrink:0;}
  .detailRow .dVal{color:var(--text);word-break:break-word;}
  .detailProducts{margin:4px 0;}
  .detailProducts div{padding:3px 0;font-size:13px;}
  .btnWa{
    flex:1;padding:12px;border-radius:10px;border:none;cursor:pointer;
    background:#25D366;color:#063d1c;font-weight:800;
  }
  .btnWa:hover{opacity:0.9;}
  .btnWa.disabled{background:var(--navy3);color:var(--muted);cursor:not-allowed;}
  .btnEdit{
    flex:1;padding:12px;border-radius:10px;border:1px solid var(--orange);cursor:pointer;
    background:transparent;color:var(--orange);font-weight:700;
  }
  .btnEdit:hover{background:rgba(255,107,53,0.1);}

  /* ---------- MODAL ---------- */
  .modalOverlay{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);
    align-items:center;justify-content:center;z-index:100;padding:16px;
  }
  .modalOverlay.show{display:flex;}
  .modal{
    background:var(--navy2);border:1px solid var(--border);border-radius:16px;
    padding:28px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;
  }
  .modal h3{margin-bottom:20px;font-size:18px;}
  .modal .field{margin-bottom:14px;}
  .modalActions{display:flex;gap:10px;margin-top:20px;}
  .btnCancel{
    flex:1;padding:12px;border-radius:10px;border:1px solid var(--border);
    background:transparent;color:var(--text);cursor:pointer;
  }
  .btnSave{
    flex:1;padding:12px;border-radius:10px;border:none;cursor:pointer;
    background:linear-gradient(135deg,var(--orange),var(--amber));color:#fff;font-weight:700;
  }
  .productRow{display:flex;gap:8px;margin-bottom:8px;}
  .productRow input{flex:1;}
  .addProductLink{color:var(--orange);font-size:12px;cursor:pointer;display:inline-block;margin-bottom:14px;}

  @media(max-width:600px){
    main{padding:14px;}
    header{padding:14px;}
    .modal{padding:20px;}
  }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <div class="loginBox">
    <div class="logo animated-logo" style="margin-bottom:4px;">
      <div class="logo-icon">
        <div class="wave-ring"></div>
        <div class="wave-ring"></div>
        <div class="wave-ring"></div>
        <i class="fas fa-wave-square"></i>
        <div class="particle p1"></div>
        <div class="particle p2"></div>
        <div class="particle p3"></div>
        <div class="particle p4"></div>
      </div>
      <div class="logo-text">
        <span class="letter">K</span><span class="letter">h</span><span class="letter">u</span><span class="letter">r</span><span class="letter">m</span><span class="letter">i</span><span class="letter">S</span><span class="letter">t</span><span class="letter">o</span><span class="letter">r</span><span class="letter">e</span>
      </div>
    </div>
    <div class="loginSub">Admin Dashboard</div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="admin@khurmistore.es">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="••••••••">
    </div>
    <button class="btnPrimary" id="loginBtn" onclick="doLogin()">Login</button>
    <div class="loginError" id="loginError"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <header>
    <div class="logo animated-logo headerLogo">
      <div class="logo-icon">
        <div class="wave-ring"></div>
        <div class="wave-ring"></div>
        <div class="wave-ring"></div>
        <i class="fas fa-wave-square"></i>
        <div class="particle p1"></div>
        <div class="particle p2"></div>
        <div class="particle p3"></div>
        <div class="particle p4"></div>
      </div>
      <div class="logo-text">
        <span class="letter">K</span><span class="letter">h</span><span class="letter">u</span><span class="letter">r</span><span class="letter">m</span><span class="letter">i</span><span class="letter">S</span><span class="letter">t</span><span class="letter">o</span><span class="letter">r</span><span class="letter">e</span>
      </div>
      <span class="adminTag">Admin</span>
    </div>
    <div class="headerRight">
      <span id="lastUpdated" class="lastUpdated"></span>
      <button class="btnGhost" onclick="loadOrders(true)" id="refreshBtn">↻ Refresh</button>
      <span id="userEmail"></span>
      <button class="btnGhost" onclick="doLogout()">Logout</button>
    </div>
  </header>

  <main>
    <div class="statsGrid">
      <div class="statCard"><div class="label">Today's Sales</div><div class="value orange" id="statToday">€0.00</div></div>
      <div class="statCard"><div class="label">This Week</div><div class="value orange" id="statWeek">€0.00</div></div>
      <div class="statCard"><div class="label">This Month</div><div class="value orange" id="statMonth">€0.00</div></div>
      <div class="statCard"><div class="label">Total Revenue</div><div class="value green" id="statRevenue">€0.00</div></div>
      <div class="statCard"><div class="label">Total Orders</div><div class="value green" id="statTotalOrders">0</div></div>
      <div class="statCard"><div class="label">Pending</div><div class="value yellow" id="statPending">0</div></div>
    </div>

    <div class="toolbar">
      <input type="text" id="searchBox" placeholder="Search by name, order#, phone..." oninput="renderOrders()">
      <select id="statusFilter" onchange="renderOrders()">
        <option value="">All Status</option>
        <option value="pending">Pending</option>
        <option value="processing">Processing</option>
        <option value="shipped">Shipped</option>
        <option value="delivered">Delivered</option>
        <option value="cancelled">Cancelled</option>
      </select>
      <select id="sourceFilter" onchange="renderOrders()">
        <option value="">All Sources</option>
        <option value="website">Website</option>
        <option value="whatsapp">WhatsApp</option>
        <option value="manual">Manual</option>
      </select>
      <div class="spacer"></div>
      <button class="btnAdd" onclick="openAddModal()">+ Add Order</button>
    </div>

    <div class="toolbar dateBar">
      <span class="dateLabel">📅 Date range:</span>
      <input type="date" id="dateFrom" onchange="onDateChange()">
      <span class="dateLabel">→</span>
      <input type="date" id="dateTo" onchange="onDateChange()">
      <select id="datePreset" onchange="applyPreset(this.value)">
        <option value="">Quick select…</option>
        <option value="today">Today</option>
        <option value="thisweek">This Week</option>
        <option value="thismonth">This Month</option>
        <option value="lastmonth">Last Month</option>
        <option value="all">All Time</option>
      </select>
      <button class="btnClearDate" onclick="clearDates()">Clear</button>
      <div class="spacer"></div>
      <span class="rangeSummary" id="rangeSummary"></span>
      <button class="btnExport" onclick="exportCSV()">⬇ Download Sheet</button>
    </div>

    <div class="tableWrap">
      <table>
        <thead>
          <tr>
            <th>Order #</th>
            <th>Customer</th>
            <th>Products</th>
            <th>Total</th>
            <th>Source</th>
            <th>Status</th>
            <th>Date</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="ordersBody">
          <tr><td colspan="8" class="emptyState">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<!-- ADD ORDER MODAL -->
<div class="modalOverlay" id="addModal">
  <div class="modal">
    <h3 id="addModalTitle">Add Order Manually</h3>
    <div class="field">
      <label>Customer Name *</label>
      <input type="text" id="m_name" placeholder="Juan Pérez">
    </div>
    <div class="field">
      <label>Phone</label>
      <input type="text" id="m_phone" placeholder="+34 6XX XXX XXX">
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="m_email" placeholder="cliente@email.com">
    </div>
    <div class="field">
      <label>Address (calle, ciudad, código postal)</label>
      <input type="text" id="m_address" placeholder="Calle Mayor 1, Madrid, 28013">
    </div>
    <div class="field">
      <label>Products</label>
      <div id="productRows">
        <div class="productRow">
          <input type="text" placeholder="Product name" class="prodName">
          <input type="number" placeholder="Qty" class="prodQty" style="max-width:70px" value="1">
        </div>
      </div>
      <span class="addProductLink" onclick="addProductRow()">+ Add another product</span>
    </div>
    <div class="field">
      <label>Total Amount (€) *</label>
      <input type="number" step="0.01" id="m_total" placeholder="29.99">
    </div>
    <div class="field">
      <label>Source</label>
      <select id="m_source">
        <option value="whatsapp">WhatsApp</option>
        <option value="manual">Manual</option>
        <option value="website">Website</option>
      </select>
    </div>
    <div class="field">
      <label>Status</label>
      <select id="m_status">
        <option value="pending">Pending</option>
        <option value="processing">Processing</option>
        <option value="shipped">Shipped</option>
        <option value="delivered">Delivered</option>
      </select>
    </div>
    <div class="modalActions">
      <button class="btnCancel" onclick="closeAddModal()">Cancel</button>
      <button class="btnSave" id="saveOrderBtn" onclick="saveManualOrder()">Save Order</button>
    </div>
  </div>
</div>

<!-- ORDER DETAIL MODAL -->
<div class="modalOverlay" id="detailModal">
  <div class="modal">
    <div class="detailHead">
      <h3 id="d_orderNumber">Order</h3>
      <span class="statusBadge" id="d_statusBadge">pending</span>
    </div>
    <div id="detailBody"></div>
    <div class="modalActions" style="flex-wrap:wrap;gap:8px;">
      <button class="btnWa" id="d_waBtn" onclick="waCustomer()">💬 WhatsApp</button>
      <button class="btnEdit" onclick="editCurrentOrder()">✎ Edit</button>
      <button class="btnCancel" onclick="closeDetail()">Close</button>
    </div>
  </div>
</div>

<script>
  // ====== CONFIG: Fill these in from your Supabase project settings ======
  const SUPABASE_URL = "https://fwqxenybcijdrlchurmb.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ3cXhlbnliY2lqZHJsY2h1cm1iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNzQ0MDAsImV4cCI6MjA5NTg1MDQwMH0.VjDjhclsaSzsoan0pZVgwofbxxfvI2HrLQk2_llXZ5s";
  // ==========================================================================

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  let allOrders = [];

  // ---------- AUTH ----------
  async function doLogin(){
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const errEl = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');
    errEl.textContent = "";
    if(!email || !password){ errEl.textContent = "Email aur password dono dalein"; return; }
    btn.disabled = true; btn.textContent = "Logging in...";
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    btn.disabled = false; btn.textContent = "Login";
    if(error){ errEl.textContent = "Galat email ya password"; return; }
    showDashboard(data.user);
  }

  async function doLogout(){
    if(autoRefreshTimer){ clearInterval(autoRefreshTimer); autoRefreshTimer = null; }
    await sb.auth.signOut();
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
  }

  async function checkSession(){
    const { data } = await sb.auth.getSession();
    if(data.session){ showDashboard(data.session.user); }
  }

  let autoRefreshTimer = null;
  function showDashboard(user){
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    document.getElementById('userEmail').textContent = user.email;
    loadOrders();
    // auto-refresh every 60s so new orders appear without reloading
    if(autoRefreshTimer) clearInterval(autoRefreshTimer);
    autoRefreshTimer = setInterval(()=>loadOrders(false), 60000);
  }

  // ---------- LOAD ORDERS ----------
  async function loadOrders(isManualRefresh){
    const refreshBtn = document.getElementById('refreshBtn');
    if(isManualRefresh && refreshBtn){ refreshBtn.classList.add('spinning'); refreshBtn.textContent = '↻ ...'; }

    const { data, error } = await sb.from('orders').select('*').order('created_at', { ascending: false });

    if(refreshBtn){ refreshBtn.classList.remove('spinning'); refreshBtn.textContent = '↻ Refresh'; }
    if(error){ console.error(error); return; }
    allOrders = data || [];
    updateStats();
    renderOrders();

    const lu = document.getElementById('lastUpdated');
    if(lu){ lu.textContent = 'Updated ' + new Date().toLocaleTimeString('es-ES', {hour:'2-digit',minute:'2-digit'}); }
  }

  function updateStats(){
    const now = new Date();
    const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const weekStart = new Date(todayStart); weekStart.setDate(weekStart.getDate() - weekStart.getDay());
    const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);

    let today=0, week=0, month=0, pending=0, revenue=0;
    allOrders.forEach(o=>{
      const d = new Date(o.created_at);
      const amt = parseFloat(o.total_amount) || 0;
      revenue += amt;
      if(d >= todayStart) today += amt;
      if(d >= weekStart) week += amt;
      if(d >= monthStart) month += amt;
      if(o.status === 'pending') pending++;
    });

    document.getElementById('statToday').textContent = '€' + today.toFixed(2);
    document.getElementById('statWeek').textContent = '€' + week.toFixed(2);
    document.getElementById('statMonth').textContent = '€' + month.toFixed(2);
    document.getElementById('statRevenue').textContent = '€' + revenue.toFixed(2);
    document.getElementById('statTotalOrders').textContent = allOrders.length;
    document.getElementById('statPending').textContent = pending;
  }

  // Shared filter — used by table render AND export
  function getFilteredOrders(){
    const search = document.getElementById('searchBox').value.toLowerCase();
    const statusF = document.getElementById('statusFilter').value;
    const sourceF = document.getElementById('sourceFilter').value;
    const fromStr = document.getElementById('dateFrom').value;
    const toStr = document.getElementById('dateTo').value;

    const fromDate = fromStr ? new Date(fromStr + 'T00:00:00') : null;
    // 'to' is inclusive of the whole day
    const toDate = toStr ? new Date(toStr + 'T23:59:59') : null;

    return allOrders.filter(o=>{
      const matchSearch = !search ||
        (o.customer_name||'').toLowerCase().includes(search) ||
        (o.order_number||'').toLowerCase().includes(search) ||
        (o.phone||'').toLowerCase().includes(search);
      const matchStatus = !statusF || o.status === statusF;
      const matchSource = !sourceF || o.source === sourceF;
      const d = new Date(o.created_at);
      const matchFrom = !fromDate || d >= fromDate;
      const matchTo = !toDate || d <= toDate;
      return matchSearch && matchStatus && matchSource && matchFrom && matchTo;
    });
  }

  function renderOrders(){
    let filtered = getFilteredOrders();
    updateRangeSummary(filtered);

    const tbody = document.getElementById('ordersBody');
    if(filtered.length === 0){
      tbody.innerHTML = '<tr><td colspan="8" class="emptyState">Koi order nahi mila</td></tr>';
      return;
    }

    tbody.innerHTML = filtered.map(o=>{
      const products = Array.isArray(o.products) ? o.products.map(p=>`${p.name} x${p.qty||1}`).join(', ') : '';
      const date = new Date(o.created_at).toLocaleDateString('es-ES', {day:'2-digit',month:'short',year:'numeric'});
      return `
        <tr>
          <td><a class="orderLink" onclick="openDetail('${o.id}')">${o.order_number}</a></td>
          <td>${o.customer_name}<br><span style="color:var(--muted);font-size:11px">${o.phone||''}</span></td>
          <td class="productsCell">${products}</td>
          <td class="totalCell">€${parseFloat(o.total_amount).toFixed(2)}</td>
          <td><span class="sourceTag">${o.source}</span></td>
          <td>
            <select class="statusSelect st-${o.status}" onchange="updateStatus('${o.id}', this.value)">
              <option value="pending" ${o.status==='pending'?'selected':''}>Pending</option>
              <option value="processing" ${o.status==='processing'?'selected':''}>Processing</option>
              <option value="shipped" ${o.status==='shipped'?'selected':''}>Shipped</option>
              <option value="delivered" ${o.status==='delivered'?'selected':''}>Delivered</option>
              <option value="cancelled" ${o.status==='cancelled'?'selected':''}>Cancelled</option>
            </select>
          </td>
          <td>${date}</td>
          <td style="white-space:nowrap">
            <button class="iconBtn" title="View details" onclick="openDetail('${o.id}')">👁</button>
            <button class="iconBtn delBtn" title="Delete" onclick="deleteOrder('${o.id}')">🗑</button>
          </td>
        </tr>
      `;
    }).join('');
  }

  // ---------- DATE RANGE + EXPORT ----------
  function onDateChange(){
    document.getElementById('datePreset').value = ''; // manual change clears preset label
    renderOrders();
  }

  function clearDates(){
    document.getElementById('dateFrom').value = '';
    document.getElementById('dateTo').value = '';
    document.getElementById('datePreset').value = '';
    renderOrders();
  }

  function fmtDate(d){
    // returns YYYY-MM-DD for input[type=date]
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }

  function applyPreset(preset){
    const now = new Date();
    let from = null, to = null;

    if(preset === 'today'){
      from = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      to = from;
    } else if(preset === 'thisweek'){
      const day = now.getDay(); // 0=Sun
      const diff = (day === 0 ? 6 : day - 1); // week starts Monday
      from = new Date(now.getFullYear(), now.getMonth(), now.getDate() - diff);
      to = now;
    } else if(preset === 'thismonth'){
      from = new Date(now.getFullYear(), now.getMonth(), 1);
      to = new Date(now.getFullYear(), now.getMonth()+1, 0); // last day of month
    } else if(preset === 'lastmonth'){
      from = new Date(now.getFullYear(), now.getMonth()-1, 1);
      to = new Date(now.getFullYear(), now.getMonth(), 0);
    } else if(preset === 'all'){
      from = null; to = null;
    } else {
      return;
    }

    document.getElementById('dateFrom').value = from ? fmtDate(from) : '';
    document.getElementById('dateTo').value = to ? fmtDate(to) : '';
    renderOrders();
  }

  function updateRangeSummary(filtered){
    const fromStr = document.getElementById('dateFrom').value;
    const toStr = document.getElementById('dateTo').value;
    const total = filtered.reduce((s,o)=> s + (parseFloat(o.total_amount)||0), 0);
    const el = document.getElementById('rangeSummary');
    let label = '';
    if(fromStr || toStr){
      label = `${fromStr||'…'} → ${toStr||'…'}  •  `;
    }
    el.textContent = `${label}${filtered.length} orders • €${total.toFixed(2)}`;
  }

  function exportCSV(){
    const rows = getFilteredOrders();
    if(rows.length === 0){ alert('Is range mein koi order nahi hai'); return; }

    const headers = ['Order #','Date','Customer','Phone','Email','Address','Products','Total (EUR)','Payment','Source','Status','Notes'];
    const csvLines = [headers.join(',')];

    const esc = (v)=>{
      v = (v===null||v===undefined) ? '' : String(v);
      if(v.includes('"') || v.includes(',') || v.includes('\n')){
        return '"' + v.replace(/"/g,'""') + '"';
      }
      return v;
    };

    rows.forEach(o=>{
      const products = Array.isArray(o.products) ? o.products.map(p=>`${p.name} x${p.qty||1}`).join(' | ') : '';
      const dateStr = new Date(o.created_at).toLocaleString('es-ES');
      csvLines.push([
        esc(o.order_number),
        esc(dateStr),
        esc(o.customer_name),
        esc(o.phone),
        esc(o.email),
        esc(o.address),
        esc(products),
        esc(parseFloat(o.total_amount).toFixed(2)),
        esc(o.payment_method),
        esc(o.source),
        esc(o.status),
        esc(o.notes)
      ].join(','));
    });

    // total row
    const grand = rows.reduce((s,o)=> s + (parseFloat(o.total_amount)||0), 0);
    csvLines.push('');
    csvLines.push(['','','','','','','TOTAL', grand.toFixed(2),'','','',''].map(esc).join(','));

    const csv = '\uFEFF' + csvLines.join('\n'); // BOM for Excel UTF-8
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);

    const fromStr = document.getElementById('dateFrom').value || 'inicio';
    const toStr = document.getElementById('dateTo').value || 'hoy';
    const a = document.createElement('a');
    a.href = url;
    a.download = `KhurmiStore_ventas_${fromStr}_a_${toStr}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  async function updateStatus(id, newStatus){
    const { error } = await sb.from('orders').update({ status: newStatus }).eq('id', id);
    if(error){ alert('Update fail hua: ' + error.message); return; }
    const o = allOrders.find(x=>x.id===id);
    if(o) o.status = newStatus;
    updateStats();
    renderOrders();
  }

  async function deleteOrder(id){
    if(!confirm('Yeh order delete karna hai?')) return;
    const { error } = await sb.from('orders').delete().eq('id', id);
    if(error){ alert('Delete fail hua: ' + error.message); return; }
    allOrders = allOrders.filter(o=>o.id!==id);
    updateStats();
    renderOrders();
  }

  // ---------- ADD / EDIT ORDER MODAL ----------
  let editingId = null;

  function openAddModal(){
    editingId = null;
    document.getElementById('addModalTitle').textContent = 'Add Order Manually';
    document.getElementById('saveOrderBtn').textContent = 'Save Order';
    document.getElementById('addModal').classList.add('show');
  }
  function closeAddModal(){
    editingId = null;
    document.getElementById('addModal').classList.remove('show');
    document.getElementById('m_name').value='';
    document.getElementById('m_phone').value='';
    document.getElementById('m_email').value='';
    document.getElementById('m_address').value='';
    document.getElementById('m_total').value='';
    document.getElementById('m_source').value='whatsapp';
    document.getElementById('m_status').value='pending';
    document.getElementById('productRows').innerHTML = `
      <div class="productRow">
        <input type="text" placeholder="Product name" class="prodName">
        <input type="number" placeholder="Qty" class="prodQty" style="max-width:70px" value="1">
      </div>`;
  }

  function addProductRow(name, qty){
    const div = document.createElement('div');
    div.className = 'productRow';
    div.innerHTML = `<input type="text" placeholder="Product name" class="prodName" value="${name?escAttr(name):''}">
      <input type="number" placeholder="Qty" class="prodQty" style="max-width:70px" value="${qty||1}">`;
    document.getElementById('productRows').appendChild(div);
  }

  async function saveManualOrder(){
    const name = document.getElementById('m_name').value.trim();
    const total = parseFloat(document.getElementById('m_total').value);
    if(!name || !total){ alert('Naam aur total amount zaroori hai'); return; }

    const products = Array.from(document.querySelectorAll('.productRow')).map(row=>({
      name: row.querySelector('.prodName').value.trim(),
      qty: parseInt(row.querySelector('.prodQty').value) || 1
    })).filter(p=>p.name);

    const fields = {
      customer_name: name,
      phone: document.getElementById('m_phone').value.trim(),
      email: document.getElementById('m_email').value.trim(),
      address: document.getElementById('m_address').value.trim(),
      products: products,
      total_amount: total,
      source: document.getElementById('m_source').value,
      status: document.getElementById('m_status').value
    };

    if(editingId){
      // EDIT existing
      const { error } = await sb.from('orders').update(fields).eq('id', editingId);
      if(error){ alert('Update fail hua: ' + error.message); return; }
    } else {
      // NEW
      fields.order_number = 'KS-' + Date.now().toString().slice(-8);
      fields.payment_method = 'cod';
      const { error } = await sb.from('orders').insert(fields);
      if(error){ alert('Save fail hua: ' + error.message); return; }
    }
    closeAddModal();
    loadOrders();
  }

  // ---------- ORDER DETAIL MODAL ----------
  let currentDetailId = null;

  function openDetail(id){
    const o = allOrders.find(x=>x.id===id);
    if(!o) return;
    currentDetailId = id;

    document.getElementById('d_orderNumber').textContent = o.order_number;
    const badge = document.getElementById('d_statusBadge');
    badge.textContent = o.status;
    badge.className = 'statusBadge st-' + o.status;

    const products = Array.isArray(o.products) ? o.products : [];
    const prodHtml = products.length
      ? products.map(p=>`<div>• ${escHtml(p.name)} × ${p.qty||1}${p.price?` — €${parseFloat(p.price).toFixed(2)}`:''}</div>`).join('')
      : '<div style="color:var(--muted)">—</div>';

    const created = new Date(o.created_at).toLocaleString('es-ES');
    const updated = o.updated_at ? new Date(o.updated_at).toLocaleString('es-ES') : '—';

    const row = (k,v)=> v ? `<div class="detailRow"><div class="dKey">${k}</div><div class="dVal">${v}</div></div>` : '';

    document.getElementById('detailBody').innerHTML =
      row('Customer', escHtml(o.customer_name)) +
      row('Phone', escHtml(o.phone)) +
      row('Email', escHtml(o.email)) +
      row('Address', escHtml(o.address)) +
      `<div class="detailRow"><div class="dKey">Products</div><div class="dVal detailProducts">${prodHtml}</div></div>` +
      row('Total', `<b style="color:var(--orange)">€${parseFloat(o.total_amount).toFixed(2)}</b>`) +
      row('Payment', escHtml(o.payment_method)) +
      row('Source', escHtml(o.source)) +
      row('Notes', escHtml(o.notes)) +
      row('Created', created) +
      row('Updated', updated);

    // WhatsApp button enable/disable based on phone
    const waBtn = document.getElementById('d_waBtn');
    if(o.phone && o.phone.replace(/[^0-9]/g,'').length >= 9){
      waBtn.classList.remove('disabled');
    } else {
      waBtn.classList.add('disabled');
    }

    document.getElementById('detailModal').classList.add('show');
  }

  function closeDetail(){
    document.getElementById('detailModal').classList.remove('show');
    currentDetailId = null;
  }

  function waCustomer(){
    const o = allOrders.find(x=>x.id===currentDetailId);
    if(!o || !o.phone) return;
    let p = o.phone.replace(/[^0-9]/g,'');
    if(p.startsWith('00')) p = p.slice(2);
    if(p.length === 9) p = '34' + p; // Spain default
    const msg = encodeURIComponent(`Hola ${o.customer_name||''}, tu pedido ${o.order_number} en KhurmiStore`);
    window.open(`https://wa.me/${p}?text=${msg}`, '_blank');
  }

  function editCurrentOrder(){
    const o = allOrders.find(x=>x.id===currentDetailId);
    if(!o) return;
    closeDetail();

    editingId = o.id;
    document.getElementById('addModalTitle').textContent = 'Edit Order — ' + o.order_number;
    document.getElementById('saveOrderBtn').textContent = 'Update Order';
    document.getElementById('m_name').value = o.customer_name || '';
    document.getElementById('m_phone').value = o.phone || '';
    document.getElementById('m_email').value = o.email || '';
    document.getElementById('m_address').value = o.address || '';
    document.getElementById('m_total').value = o.total_amount || '';
    document.getElementById('m_source').value = o.source || 'manual';
    document.getElementById('m_status').value = o.status || 'pending';

    const rows = document.getElementById('productRows');
    rows.innerHTML = '';
    const prods = Array.isArray(o.products) && o.products.length ? o.products : [{name:'',qty:1}];
    prods.forEach(p=>addProductRow(p.name, p.qty));

    document.getElementById('addModal').classList.add('show');
  }

  // small HTML-escape helpers (safety for customer-entered text)
  function escHtml(s){
    if(s===null||s===undefined) return '';
    return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function escAttr(s){ return escHtml(s); }

  // init
  checkSession();
</script>
</body>
</html>
