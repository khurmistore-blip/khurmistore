<!-- FAQPage Schema -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "¿Cuál es el tiempo de envío?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Ofrecemos envío gratis en pedidos superiores a 50€ con entrega en 3-5 días laborales. Para pedidos menores, el envío es de 4,99€ con el mismo tiempo de entrega."
      }
    },
    {
      "@type": "Question",
      "name": "¿Puedo devolver un producto?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Sí, ofrecemos una política de devolución de 14 días. Los productos deben estar sin usar y en su embalaje original. Los costos de envío de devolución corren por tu cuenta."
      }
    },
    {
      "@type": "Question",
      "name": "¿Qué métodos de pago aceptan?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Aceptamos tarjeta de crédito/débito, PayPal, Bizum, transferencia bancaria y contra reembolso. Todos los pagos están protegidos con cifrado SSL."
      }
    },
    {
      "@type": "Question",
      "name": "¿Son productos originales?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "100% sí. Todos nuestros productos son originales con garantía del fabricante. Trabajamos directamente con distribuidores autorizados."
      }
    }
  ]
}
</script>
